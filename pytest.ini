[pytest]
# Disable colors in captured logs for Allure
log_auto_indent = false
addopts = -s -v
log_cli = 0
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Format for captured logs (Allure attachment)
log_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning





;firtst_test.py


;python_files = *_t.py
;python_functions = tc_*
;python_classes  = First



;strict_markers = true
;--strict-markers

markers  = negative:  marks for negative
        regression: marks  for regression
        smoke: marks  for smoke
        db_test: mark test
        positive: marks  for positive
        negative
        regression
        api_test
        asdasdd
        smoke_test
        asdasdasd
